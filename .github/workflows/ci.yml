name: BacklotOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AGENTCUT_SUBTITLE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install components
        run: python -m pip install components/agentcut components/review-agent 'components/story-agent[test]' 'components/producer-supervisor-agent[test]' 'components/launcher[test]'
      - name: Verify repository boundaries
        run: ./scripts/verify-repository.sh
      - name: Runtime profile tests
        run: python -m unittest -v scripts.tests.test_runtime_profile scripts.tests.test_source_metadata
      - name: Source archive metadata smoke test
        run: |
          git archive --format=tar.gz --prefix=backlotos-ci/ -o "$RUNNER_TEMP/backlotos-ci.tar.gz" HEAD
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf "$RUNNER_TEMP/backlotos-ci.tar.gz" -C "$RUNNER_TEMP/archive"
          source "$RUNNER_TEMP/archive/backlotos-ci/scripts/lib/source-metadata.sh"
          backlot_write_source_metadata "$RUNNER_TEMP/archive/backlotos-ci" "$RUNNER_TEMP/archive-install"
          test "$(cat "$RUNNER_TEMP/archive-install/source/git-commit")" = "source-archive:v$(cat VERSION)"
      - name: Review Agent tests
        working-directory: components/review-agent
        run: python -m unittest -v tests.test_core.EpisodeRuntimeAndVisualPacingTests tests.test_core.ShotRecipeConformanceTests tests.test_storyclaw_image_adapter
      - name: Story Agent tests
        run: python -m pytest -q components/story-agent/tests
      - name: One-click Launcher tests
        run: python -m pytest -q components/launcher/tests
      - name: Producer/Supervisor Agent tests
        run: python -m pytest -q components/producer-supervisor-agent/tests
      - name: Prompt and BGM production-gate tests
        run: python -m unittest discover -s components/pipeline-tools/tests -p 'test_action_prompt_pipeline_cli.py' -v && python -m unittest discover -s components/pipeline-tools/tests -p 'test_bgm_authenticity_gate.py' -v && python -m unittest discover -s components/pipeline-tools/tests -p 'test_dependency_lane_concurrency.py' -v
      - name: Action prompt compatibility and root-cause gates
        working-directory: components/pipeline-tools
        run: python -m unittest -v tests.test_action_shot_design_gate tests.test_action_spatial_feasibility_gate tests.test_generation_prompt_optimizer tests.test_action_direction_contract_gate tests.test_action_actor_ownership_gate tests.test_shot_space_camera_constraint_gate tests.test_video_prompt_action_density_gate
      - name: AgentCut tests
        run: python -m unittest discover -s components/agentcut/tests -v
      - name: AgentCut compatibility tests
        run: python -m unittest discover -s components/agentcut/compat_tests -v
      - name: Factory Runtime tests
        run: python components/factory-runtime/tests/run_all_tests.py
      - name: Installed CLI smoke test
        run: qingshan-review health && agentcut health && claude-story-agent health && backlotos health && echo '{"verb":"health"}' | backlotos-producer-command && echo '{"verb":"health"}' | BACKLOT_PIPELINE_TOOLS_DIR="$PWD/components/pipeline-tools" backlotos-pipeline-command
