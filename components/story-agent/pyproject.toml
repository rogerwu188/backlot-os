[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-story-agent"
version = "0.2.1"
description = "Portable Story + Script Review agents for BacklotOS (generic short-drama core)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary — BacklotOS"}
dependencies = []                       # core runs on stdlib only

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]         # only if using the Anthropic backend
test = ["pytest>=7"]

[project.scripts]
claude-story-agent = "claude_story_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
